<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Roda da Sorte</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #111;
  color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100dvh;
  padding: 20px 16px 32px;
  gap: 16px;
}

h1 {
  font-size: 1.6rem;
  font-weight: 800;
  letter-spacing: -0.5px;
  color: #fff;
}

/* WHEEL */
.wheel-container {
  position: relative;
  width: min(320px, 88vw);
  height: min(320px, 88vw);
  flex-shrink: 0;
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
  border-radius: 50%;
}

.pointer {
  position: absolute;
  top: 50%;
  right: -18px;
  transform: translateY(-50%);
  width: 0;
  height: 0;
  border-top: 12px solid transparent;
  border-bottom: 12px solid transparent;
  border-right: 28px solid #fff;
  filter: drop-shadow(0 0 6px rgba(255,255,255,0.6));
  z-index: 10;
}

.spin-btn {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 10;
  width: 60px;
  height: 60px;
  border-radius: 50%;
  border: 3px solid #111;
  background: #fff;
  color: #111;
  font-size: 0.75rem;
  font-weight: 900;
  letter-spacing: 0.5px;
  cursor: pointer;
  box-shadow: 0 2px 12px #0008;
  -webkit-tap-highlight-color: transparent;
  transition: transform 0.1s;
}

.spin-btn:active { transform: translate(-50%, -50%) scale(0.92); }
.spin-btn:disabled { opacity: 0.5; }

/* RESULT */
.result {
  background: #1e1e1e;
  border-radius: 14px;
  padding: 14px 24px;
  text-align: center;
  width: min(420px, 92vw);
}

.result-label {
  font-size: 0.7rem;
  color: #666;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  margin-bottom: 4px;
}

.result-value {
  font-size: 1.5rem;
  font-weight: 800;
  color: #fff;
  transition: color 0.3s;
}

/* EDITOR */
.editor {
  background: #1e1e1e;
  border-radius: 14px;
  padding: 16px;
  width: min(420px, 92vw);
}

.editor-title {
  font-size: 0.75rem;
  color: #666;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  margin-bottom: 12px;
}

.items {
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-height: 200px;
  overflow-y: auto;
}

.item-row {
  display: flex;
  gap: 8px;
  align-items: center;
}

.color-dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  flex-shrink: 0;
}

input[type=text] {
  flex: 1;
  background: #111;
  border: 1px solid #333;
  border-radius: 8px;
  color: #fff;
  font-size: 0.9rem;
  font-family: inherit;
  padding: 7px 10px;
  outline: none;
}

input[type=text]:focus { border-color: #555; }

input[type=number] {
  width: 56px;
  background: #111;
  border: 1px solid #333;
  border-radius: 8px;
  color: #fff;
  font-size: 0.9rem;
  font-family: inherit;
  padding: 7px 8px;
  outline: none;
  text-align: center;
}

input[type=number]:focus { border-color: #555; }

.pct {
  font-size: 0.75rem;
  color: #555;
  width: 36px;
  text-align: right;
  flex-shrink: 0;
}

.del-btn {
  background: none;
  border: 1px solid #333;
  border-radius: 8px;
  color: #666;
  font-size: 1rem;
  cursor: pointer;
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  -webkit-tap-highlight-color: transparent;
}

.del-btn:active { background: #2a2a2a; }

.add-row {
  display: flex;
  gap: 8px;
  align-items: center;
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid #2a2a2a;
}

.add-btn {
  background: #fff;
  border: none;
  border-radius: 8px;
  color: #111;
  font-size: 1.2rem;
  font-weight: 700;
  cursor: pointer;
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  -webkit-tap-highlight-color: transparent;
  transition: transform 0.1s;
}

.add-btn:active { transform: scale(0.9); }

@keyframes pop {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.1); }
}
.pop { animation: pop 0.3s ease; }
</style>
</head>
<body>

<h1>Roda da Sorte</h1>

<div class="wheel-container">
  <canvas id="wheel"></canvas>
  <div class="pointer"></div>
  <button class="spin-btn" id="spinBtn" onclick="spin()">GIRAR</button>
</div>

<div class="result">
  <div class="result-label">Resultado</div>
  <div class="result-value" id="resultValue">—</div>
</div>

<div class="editor">
  <div class="editor-title">Opções</div>
  <div class="items" id="itemList"></div>
  <div class="add-row">
    <input type="text" id="newLabel" placeholder="Nova opção..." maxlength="20">
    <input type="number" id="newWeight" value="1" min="1" max="999">
    <button class="add-btn" onclick="addItem()">+</button>
  </div>
</div>

<script>
const COLORS = [
  '#E74C3C','#E67E22','#F1C40F','#27AE60',
  '#2980B9','#8E44AD','#16A085','#D35400',
  '#2ECC71','#3498DB','#9B59B6','#1ABC9C'
];

let items = [
  { label: 'Opção 1', weight: 3 },
  { label: 'Opção 2', weight: 2 },
  { label: 'Opção 3', weight: 1 },
  { label: 'Opção 4', weight: 2 },
  { label: 'Opção 5', weight: 1 },
];

const canvas = document.getElementById('wheel');
const ctx = canvas.getContext('2d');
let currentAngle = -Math.PI / 2; // start so first slice top-right
let spinning = false;

function setup() {
  const dpr = window.devicePixelRatio || 1;
  const size = canvas.offsetWidth || 320;
  canvas.width = size * dpr;
  canvas.height = size * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  draw();
}

function totalWeight() {
  return items.reduce((s, i) => s + Math.max(1, Number(i.weight) || 1), 0);
}

function draw() {
  const size = canvas.offsetWidth || 320;
  const cx = size / 2, cy = size / 2;
  const r = cx - 2;
  ctx.clearRect(0, 0, size, size);

  if (!items.length) return;

  const total = totalWeight();
  let angle = currentAngle;

  items.forEach((item, i) => {
    const slice = (Math.max(1, Number(item.weight) || 1) / total) * 2 * Math.PI;
    const endAngle = angle + slice;
    const color = COLORS[i % COLORS.length];

    // Slice
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, angle, endAngle);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
    ctx.strokeStyle = '#111';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Label
    const midAngle = angle + slice / 2;
    const labelR = r * 0.62;
    const lx = cx + Math.cos(midAngle) * labelR;
    const ly = cy + Math.sin(midAngle) * labelR;

    ctx.save();
    ctx.translate(lx, ly);
    ctx.rotate(midAngle + Math.PI / 2);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${Math.max(10, Math.min(14, r * 0.055))}px -apple-system, BlinkMacSystemFont, sans-serif`;
    ctx.shadowColor = 'rgba(0,0,0,0.7)';
    ctx.shadowBlur = 3;
    const text = item.label.length > 13 ? item.label.slice(0, 12) + '…' : item.label;
    ctx.fillText(text, 0, 0);
    ctx.restore();

    angle = endAngle;
  });

  // Outer ring
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, 2 * Math.PI);
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 4;
  ctx.stroke();

  // Center cap
  ctx.beginPath();
  ctx.arc(cx, cy, 28, 0, 2 * Math.PI);
  ctx.fillStyle = '#111';
  ctx.fill();
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 3;
  ctx.stroke();
}

function spin() {
  if (spinning || items.length < 2) return;
  spinning = true;
  document.getElementById('spinBtn').disabled = true;

  const totalW = totalWeight();
  const extra = (4 + Math.random() * 3) * 2 * Math.PI;
  const target = currentAngle + extra;
  const duration = 3000 + Math.random() * 1200;
  const start = performance.now();
  const startAngle = currentAngle;
  let lastTick = 0;

  function easeOut(t) {
    return 1 - Math.pow(1 - t, 4);
  }

  function frame(now) {
    const t = Math.min((now - start) / duration, 1);
    currentAngle = startAngle + easeOut(t) * (target - startAngle);

    // tick sound
    const tickStep = 0.3 * (1 - easeOut(t) * 0.85);
    if (currentAngle - lastTick > tickStep) {
      playTick();
      lastTick = currentAngle;
    }

    draw();

    if (t < 1) {
      requestAnimationFrame(frame);
    } else {
      currentAngle = currentAngle % (2 * Math.PI);
      draw();
      showResult();
      spinning = false;
      document.getElementById('spinBtn').disabled = false;
    }
  }

  requestAnimationFrame(frame);
}

let ac;
function playTick() {
  try {
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.connect(g); g.connect(ac.destination);
    o.frequency.value = 800;
    g.gain.setValueAtTime(0.06, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.04);
    o.start(); o.stop(ac.currentTime + 0.04);
  } catch(e) {}
}

function showResult() {
  // Pointer is on the RIGHT (0 degrees = right). Find which slice is at angle 0.
  const totalW = totalWeight();
  // Normalize: which angle is at the pointer (rightmost point = 0)
  let a = (-(currentAngle % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
  let acc = 0;
  let winner = items[0];
  for (let i = 0; i < items.length; i++) {
    acc += (Math.max(1, Number(items[i].weight) || 1) / totalW) * 2 * Math.PI;
    if (a < acc) { winner = items[i]; break; }
  }
  const el = document.getElementById('resultValue');
  el.textContent = winner.label;
  el.style.color = COLORS[items.indexOf(winner) % COLORS.length];
  el.classList.remove('pop');
  void el.offsetWidth;
  el.classList.add('pop');
}

// Editor
function renderItems() {
  const list = document.getElementById('itemList');
  list.innerHTML = '';
  const total = totalWeight();
  items.forEach((item, i) => {
    const row = document.createElement('div');
    row.className = 'item-row';

    const dot = document.createElement('div');
    dot.className = 'color-dot';
    dot.style.background = COLORS[i % COLORS.length];

    const lbl = document.createElement('input');
    lbl.type = 'text';
    lbl.value = item.label;
    lbl.maxLength = 20;
    lbl.addEventListener('input', e => { items[i].label = e.target.value; draw(); });

    const wt = document.createElement('input');
    wt.type = 'number';
    wt.value = item.weight;
    wt.min = 1; wt.max = 999;
    wt.addEventListener('input', e => {
      items[i].weight = Math.max(1, Number(e.target.value) || 1);
      renderItems(); draw();
    });

    const pct = document.createElement('div');
    pct.className = 'pct';
    pct.textContent = ((Math.max(1, Number(item.weight) || 1) / total) * 100).toFixed(0) + '%';

    const del = document.createElement('button');
    del.className = 'del-btn';
    del.textContent = '×';
    del.onclick = () => {
      if (items.length <= 2) return;
      items.splice(i, 1);
      renderItems(); draw();
    };

    row.append(dot, lbl, wt, pct, del);
    list.appendChild(row);
  });
}

function addItem() {
  const label = document.getElementById('newLabel').value.trim() || `Opção ${items.length + 1}`;
  const weight = Math.max(1, Number(document.getElementById('newWeight').value) || 1);
  items.push({ label, weight });
  document.getElementById('newLabel').value = '';
  document.getElementById('newWeight').value = 1;
  renderItems(); draw();
}

window.addEventListener('resize', setup);
renderItems();
setup();
</script>
</body>
</html>
